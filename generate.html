<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tessera — Generate</title>
  <link rel="stylesheet" href="style/base.css" />
  <link rel="stylesheet" href="style/nav.css" />
  <link rel="stylesheet" href="style/generate.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
<div id="gen-page">

  <!-- ── Nav ────────────────────────────────────────────────── -->
  <nav id="page-nav">
    <a href="index.html" class="nav-brand">TESSERA</a>
    <a href="index.html">Sequencer</a>
    <a href="recorder.html">Recorder</a>
    <a href="generate.html" class="active">Generate</a>
  </nav>

  <!-- ── Generator tabs ─────────────────────────────────────── -->
  <div id="gen-tab-bar">
    <button class="gen-tab active" data-panel="euclid-panel">Euclidean</button>
    <button class="gen-tab"        data-panel="markov-panel">Markov Chain</button>
    <button class="gen-tab"        data-panel="drums-panel">Drums</button>
  </div>

  <!-- ── Panels ─────────────────────────────────────────────── -->
  <div id="gen-panels">

    <!-- ── Euclidean ────────────────────────────────────────── -->
    <div id="euclid-panel" class="gen-panel">
      <div class="gen-split">

        <!-- Left: visualisation -->
        <div class="gen-left">
          <div class="gen-vis-title">Euclidean Rhythm Generator</div>

          <div id="ring-wrap">
            <canvas id="ring-canvas"></canvas>
          </div>

          <div class="strip-wrap">
            <div class="strip-label">Pattern</div>
            <canvas id="strip-canvas"></canvas>
          </div>
        </div>

        <!-- Right: controls -->
        <div class="gen-right">

          <div class="gen-section">
            <div class="gen-section-heading">Rhythm</div>
            <div class="gen-row">
              <label>Steps</label>
              <input id="gen-steps" type="range" min="1" max="64" value="16" />
              <span id="gen-steps-val" class="val-readout">16</span>
            </div>
            <div class="gen-row">
              <label>Hits</label>
              <input id="gen-hits" type="range" min="0" max="16" value="5" />
              <span id="gen-hits-val" class="val-readout">5</span>
            </div>
            <div class="gen-row">
              <label>Rotation</label>
              <input id="gen-rot" type="range" min="0" max="15" value="0" />
              <span id="gen-rot-val" class="val-readout">0</span>
            </div>
          </div>

          <div class="gen-section">
            <div class="gen-section-heading">Note</div>
            <div class="gen-row">
              <label>MIDI</label>
              <input id="gen-note" type="number" min="0" max="127" value="36" />
              <span class="note-chip" id="gen-note-name">C2</span>
            </div>
            <div class="gen-row">
              <label>Velocity</label>
              <input id="gen-vel" type="range" min="1" max="127" value="100" />
              <span id="gen-vel-val" class="val-readout">100</span>
            </div>
            <div class="gen-row">
              <label>Glide</label>
              <button id="gen-glide-btn">Glide: OFF</button>
            </div>
          </div>

          <div class="gen-section gen-actions-section">
            <div class="send-target-group">
              <button id="gen-send-btn" class="gen-send-btn">→ Send to Sequencer</button>
              <label class="send-target-label">Sc</label>
              <input id="gen-send-scene" class="send-target-input" type="number" min="1" max="32" value="1" title="Target scene" />
              <label class="send-target-label">Tr</label>
              <input id="gen-send-track" class="send-target-input" type="number" min="1" max="16" value="1" title="Target track" />
            </div>
            <button id="gen-download-btn" class="gen-dl-btn">↓ Download Preset</button>
          </div>

        </div>
      </div>
    </div>

    <!-- ── Markov Chain ──────────────────────────────────────── -->
    <div id="markov-panel" class="gen-panel" style="display:none">
      <div class="gen-split">

        <!-- Left: visualisation -->
        <div class="gen-left">
          <div class="gen-vis-title">Markov Chain Sequencer</div>

          <div id="markov-vis-wrap">
            <canvas id="markov-vis-canvas"></canvas>
          </div>

          <div class="strip-wrap">
            <div class="strip-label">Generated Pattern</div>
            <canvas id="markov-strip-canvas"></canvas>
          </div>
        </div>

        <!-- Right: controls -->
        <div class="gen-right">

          <!-- Notes -->
          <div class="gen-section">
            <div class="gen-section-heading">Notes
              <button id="mk-add-note-btn" class="add-note-btn" title="Add note (max 8)">+ Add</button>
            </div>
            <div id="markov-notes-list"></div>
          </div>

          <!-- Transition matrix -->
          <div class="gen-section">
            <div class="gen-section-heading">Transition Weights <span class="matrix-hint">(0 = never)</span></div>
            <div id="markov-matrix-wrap" class="matrix-scroll"></div>
          </div>

          <!-- Options -->
          <div class="gen-section">
            <div class="gen-section-heading">Options</div>
            <div class="gen-row">
              <label>Steps</label>
              <input id="mk-steps" type="range" min="4" max="64" value="16" />
              <span id="mk-steps-val" class="val-readout">16</span>
            </div>
            <div class="gen-row">
              <label>Rest %</label>
              <input id="mk-rest" type="range" min="0" max="50" value="10" />
              <span id="mk-rest-val" class="val-readout">10%</span>
            </div>
            <div class="gen-row">
              <label>Velocity</label>
              <input id="mk-vel" type="range" min="1" max="127" value="100" />
              <span id="mk-vel-val" class="val-readout">100</span>
            </div>
            <div class="gen-row">
              <label>Vel ±</label>
              <input id="mk-var" type="range" min="0" max="40" value="15" />
              <span id="mk-var-val" class="val-readout">±15</span>
            </div>
            <div class="gen-row">
              <label>Glide</label>
              <button id="mk-glide-btn">Glide: OFF</button>
            </div>
          </div>

          <!-- Actions -->
          <div class="gen-section gen-actions-section">
            <button id="mk-generate-btn" class="gen-generate-btn">⚄ Generate</button>
            <div class="send-target-group">
              <button id="mk-send-btn" class="gen-send-btn">→ Send to Sequencer</button>
              <label class="send-target-label">Sc</label>
              <input id="mk-send-scene" class="send-target-input" type="number" min="1" max="32" value="1" title="Target scene" />
              <label class="send-target-label">Tr</label>
              <input id="mk-send-track" class="send-target-input" type="number" min="1" max="16" value="1" title="Target track" />
            </div>
            <button id="mk-download-btn" class="gen-dl-btn">↓ Download Preset</button>
          </div>

        </div>
      </div>
    </div>

    <!-- ── Drums ───────────────────────────────────────────────── -->
    <div id="drums-panel" class="gen-panel" style="display:none">
      <div class="drum-layout">

        <!-- Global bar -->
        <div class="drum-global-bar">
          <div class="drum-bpm-group">
            <label>BPM</label>
            <input id="drum-bpm" type="number" min="20" max="300" value="120" />
          </div>
          <div class="drum-scenes-group">
            <label>Scenes</label>
            <input id="drum-scenes" type="number" min="1" max="8" value="1" title="Fill this many scenes with the drum pattern" />
          </div>
          <div class="drum-fill-group">
            <label class="drum-fill-enable-wrap">
              <input type="checkbox" id="drum-fill-enable" />
              Fill
            </label>
            <div id="drum-fill-controls">
              <label>Len</label>
              <input id="drum-fill-length" type="range" min="1" max="16" value="4" />
              <span id="drum-fill-length-val" class="val-readout">4</span>
            </div>
          </div>
          <div class="drum-global-actions">
            <button id="drum-randomize-btn" class="gen-generate-btn">⚄ Randomize</button>
            <div class="send-target-group">
              <button id="drum-send-btn" class="gen-send-btn">→ Send to Sequencer</button>
              <label class="send-target-label">Scene</label>
              <input id="drum-send-scene" class="send-target-input" type="number" min="1" max="32" value="1" title="Starting scene" />
            </div>
          </div>
        </div>

        <!-- Voice rows (injected by drum-ui.js) -->
        <div id="drum-voices-container" class="drum-voices"></div>

      </div>
    </div>

  </div><!-- /#gen-panels -->

</div><!-- /#gen-page -->

<script type="module" src="src/generate/euclidean-ui.js"></script>
<script type="module" src="src/generate/markov-ui.js"></script>
<script type="module" src="src/generate/drum-ui.js"></script>
<script>
  // Tab switching
  document.querySelectorAll('.gen-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.gen-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.gen-panel').forEach(p => { p.style.display = 'none'; });
      btn.classList.add('active');
      document.getElementById(btn.dataset.panel).style.display = 'flex';
      document.dispatchEvent(new CustomEvent('genTabActivated', { detail: btn.dataset.panel }));
    });
  });
</script>
</body>
</html>
